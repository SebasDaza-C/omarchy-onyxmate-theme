# ────────────────────────────────────────────────────────────
# OnyxMate Custom Theme for Alacritty
# Minimalist monochrome style
# ────────────────────────────────────────────────────────────

[window]
padding.x = 0
padding.y = 0
opacity = 0.75

[colors]
[colors.primary]
background = "#0D0D0D"
foreground = "#EAEAEA"
dim_foreground = "#303030"

[colors.cursor]
cursor = "#CCCCCC"
text = "#000000"

[colors.vi_mode_cursor]
cursor = "#CCCCCC"

[colors.selection]
text = "CellForeground"
background = "#1A1A1A"

[colors.normal]
black   = "#0D0D0D"
red     = "#888888"
green   = "#888888"
yellow  = "#888888"
blue    = "#888888"
magenta = "#888888"
cyan    = "#888888"
white   = "#EAEAEA"

[colors.bright]
black   = "#303030"
red     = "#888888"
green   = "#888888"
yellow  = "#888888"
blue    = "#888888"
magenta = "#888888"
cyan    = "#888888"
white   = "#FFFFFF"
